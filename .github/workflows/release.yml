# Publicación automática: al subir una etiqueta de versión (ej. v1.1.0),
# GitHub compila el instalador de Windows, lo sube a la release y la publica.
#
# Procedimiento completo para sacar versión nueva:
#   1. Subir el número de versión en package.json y package-lock.json.
#   2. Commit + push a main (tras validar).
#   3. git tag v1.1.0 && git push origin v1.1.0
#   4. Esperar a que este workflow termine (pestaña Actions): la release queda
#      PUBLICADA (no en borrador) y el auto-updater la distribuye solo.
#
# Usa el token automático de GitHub Actions: no hace falta crear ningún
# Personal Access Token.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      # Acciones fijadas por SHA (la etiqueta va en el comentario): una etiqueta
      # se puede mover, un SHA no. Dependabot las mantiene al día.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin caché de npm a propósito: este workflow genera el instalador que se
      # distribuye, y una caché manipulada podría colarse en él.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobaciones (tipos, tests y soporte de Electron)
        run: |
          npm run typecheck
          npm test
          node scripts/check-electron-support.mjs

      # Crear la release en borrador ANTES de compilar. Si no existe,
      # electron-builder sube el instalador y el .blockmap a la vez y cada
      # subida crea su propia release (pasó en la v1.2.0). Con el borrador ya
      # creado, todas las subidas lo encuentran y van a la misma release.
      - name: Crear la release en borrador
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG ya existe; se reutiliza."
          else
            gh release create "$TAG" --draft --title "${TAG#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y subir instalador a la release
        run: npm run electron:build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Antes de publicar, comprobar que la release tiene los 3 archivos que
      # necesita el auto-updater. Si falta alguno, el job falla y la release
      # se queda en borrador (las apps instaladas no la ven).
      - name: Comprobar archivos de la release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for f in "Dashboard-Gastos-Setup-$VERSION.exe" "Dashboard-Gastos-Setup-$VERSION.exe.blockmap" "latest.yml"; do
            if ! grep -qxF "$f" <<< "$ASSETS"; then
              echo "::error::Falta $f en la release $TAG"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # La release se ha creado como BORRADOR: hay que publicarla para que el
      # auto-updater de las apps instaladas la vea.
      - name: Publicar la release (quitar borrador)
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
